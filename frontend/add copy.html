<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>
    <title>Gestor de contrasenas</title>
</head>
<body style="background-color:#FFFFFF">
    <div id="main" class="container">
        <div id="marco" class="container my-5 text-center">
            <h1>Gestor de contrasenas</h1>
            <div class="form-group">
                <label for="plataforma">Plataforma</label>
                <input type="text" class="form-control" name="plataforma" id="plataforma" placeholder="plataforma">
            </div>
            <div class="form-group">
                <label for="usuario">Usuario</label>
                <input type="text" class="form-control" name="usuario" id="usuario">
            </div>
            <div class="form-group">
                <label for="clave">Clave</label>
                <input type="password" class="form-control" name="clave" id="clave">
            </div>
            <div class="target">
                <button type="button" class="btn btn-info" onclick="registrar()">
                    <img src="guardarr.png" height="30" width="30" alt="Guardar">
                </button>
                <button type="button" class="btn btn-warning" onclick="location.href = 'index.html'">
                    <img src="atras.png" height="30" width="30" alt="Atrás">
                </button>
                <div id="div">
                </div>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
